name: CD

on:
  push:
    branches: [develop, qa, staging, main]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Choose image tag from branch
        id: tag
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
            qa)      echo "tag=qa" >> "$GITHUB_OUTPUT" ;;
            staging) echo "tag=staging" >> "$GITHUB_OUTPUT" ;;
            main)    echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            carlosquirosdev/sistema-estudiantes-api:${{ steps.tag.outputs.tag }}
            carlosquirosdev/sistema-estudiantes-api:${{ steps.tag.outputs.tag }}-${{ github.sha }}