services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: crud_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d crud_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: carlosquirosdev/sistema-estudiantes-api:${APP_TAG:-dev}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/crud_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata: