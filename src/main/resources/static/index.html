<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Page 1 (CRUD)</title>
    <style>
        /* BASE STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; padding: 30px; color: #333; }

        /* HEADER AND SEARCH */
        .header { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .search-input {
            flex-grow: 1; padding: 15px 25px; border-radius: 30px;
            border: 2px solid #ddd; font-size: 16px; outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: #3b82f6; }
        .btn-add {
            background-color: #3b82f6; color: white; border: none; padding: 0 25px;
            border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s;
        }
        .btn-add:hover { background-color: #2563eb; }

        /* GRID RESPONSIVE */
        .grid-container {
            display: grid; gap: 20px; max-width: 1200px; margin: 0 auto; grid-template-columns: 1fr;
        }
        @media (min-width: 600px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1200px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }

        /* CARDS */
        .card {
            background: white; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center; border: 1px solid #eee; transition: 0.2s; cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .card-name { font-size: 1.2rem; font-weight: bold; }

        /* MODALS (popups) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px;
            position: relative; text-align: center; transform: translateY(-20px); transition: 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #888; }

        /* CRUD FORM */
        .form-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; margin: 5px; }
        .btn-edit { background-color: #f59e0b; }
        .btn-delete { background-color: #ef4444; }
        .btn-save { background-color: #10b981; width: 100%; }
    </style>
</head>
<body>

<header class="header">
    <input type="text" id="searchInput" class="search-input" placeholder="Realtime search (Name, ID)...">
    <button class="btn-add" onclick="openFormModal()">+ New</button>

    <!-- BUTTON TO GO TO PAGE 2 -->
    <a href="rickandmorty/index.html" class="btn-add" style="background-color: #10b981; text-decoration: none; display: flex; align-items: center;">API Rick & Morty ➡</a>
</header>

<!-- READ (GET) -->
<main id="studentGrid" class="grid-container"></main>

<!-- MODAL 1: VIEW DETAILS / UPDATE / DELETE -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('detailModal')">&times;</span>
        <h3 id="modalName" style="margin-bottom:15px; font-size: 1.5rem;">Name</h3>
        <p id="modalEmail" style="color: #555; margin-bottom: 20px;">Email</p>

        <input type="hidden" id="currentId">
        <button class="btn btn-edit" onclick="editStudent()">Edit (PUT)</button>
        <button class="btn btn-delete" onclick="deleteStudent()">Delete (DELETE)</button>
    </div>
</div>

<!-- MODAL 2: FORM (CREATE AND UPDATE) -->
<div id="formModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('formModal')">&times;</span>
        <h3 id="formTitle" style="margin-bottom: 20px;">Student</h3>

        <form id="studentForm">
            <input type="hidden" id="studentId">
            <input type="text" id="firstName" class="form-input" placeholder="First name" required>
            <input type="text" id="lastName" class="form-input" placeholder="Last name" required>
            <input type="email" id="email" class="form-input" placeholder="Email" required>
            <button type="submit" class="btn btn-save">Save Student</button>
        </form>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/students';
    let allStudents = [];

    // ==========================================
    // 1. ENDPOINT GET (READ)
    // ==========================================
    function loadData() {
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                allStudents = data;
                renderCards(allStudents);
            });
    }

    function renderCards(data) {
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        data.forEach(student => {
            grid.innerHTML += `
                    <div class="card" onclick="openDetailModal(${student.id}, '${student.firstName}', '${student.lastName}', '${student.email}')">
                        <div class="card-name">${student.firstName} ${student.lastName}</div>
                        <div style="font-size: 0.8rem; color:#999; margin-top:10px;">ID: ${student.id}</div>
                    </div>`;
        });
    }

    // Realtime search (in-memory filter)
    document.getElementById('searchInput').addEventListener('input', e => {
        const kw = e.target.value.toLowerCase().trim();
        renderCards(allStudents.filter(s =>
            `${s.firstName} ${s.lastName}`.toLowerCase().includes(kw) || s.id.toString().includes(kw)
        ));
    });

    // ==========================================
    // 2. ENDPOINTS POST / PUT (CREATE / UPDATE)
    // ==========================================
    document.getElementById('studentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('studentId').value;
        const data = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            closeModal('formModal');
            loadData(); // Reload data
        });
    });

    // ==========================================
    // 3. ENDPOINT DELETE
    // ==========================================
    function deleteStudent() {
        const id = document.getElementById('currentId').value;
        if (confirm('Delete this student?')) {
            fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                .then(() => {
                    closeModal('detailModal');
                    loadData(); // Reload data
                });
        }
    }

    // ==========================================
    // MODAL CONTROL (POPUPS)
    // ==========================================
    function openDetailModal(id, firstName, lastName, email) {
        document.getElementById('currentId').value = id;
        document.getElementById('modalName').innerText = `${firstName} ${lastName}`;
        document.getElementById('modalEmail').innerText = email;

        // Keep temporary data in case the user wants to edit
        document.getElementById('modalName').dataset.first = firstName;
        document.getElementById('modalName').dataset.last = lastName;

        document.getElementById('detailModal').classList.add('active');
    }

    function openFormModal() {
        document.getElementById('studentForm').reset();
        document.getElementById('studentId').value = '';
        document.getElementById('formTitle').innerText = 'New Student (POST)';
        document.getElementById('formModal').classList.add('active');
    }

    function editStudent() {
        closeModal('detailModal');
        document.getElementById('studentId').value = document.getElementById('currentId').value;
        document.getElementById('firstName').value = document.getElementById('modalName').dataset.first;
        document.getElementById('lastName').value = document.getElementById('modalName').dataset.last;
        document.getElementById('email').value = document.getElementById('modalEmail').innerText;

        document.getElementById('formTitle').innerText = 'Edit Student (PUT)';
        document.getElementById('formModal').classList.add('active');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    // Start
    loadData();
</script>
</body>
</html>
