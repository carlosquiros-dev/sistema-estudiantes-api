<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Page 1 (CRUD)</title>
    <link rel="stylesheet" href="students/css/styles.css">
</head>
<body>

<header class="header">
    <input type="text" id="searchInput" class="search-input" placeholder="Realtime search (Name, ID)...">
    <button id="newBtn" class="btn-add">+ New</button>

    <!-- BUTTON TO GO TO PAGE 2 -->
    <a href="rickandmorty/index.html" class="btn-add btn-rm">API Rick & Morty ➡</a>
</header>

<!-- READ (GET) -->
<main id="studentGrid" class="grid-container"></main>

<!-- MODAL 1: VIEW DETAILS / UPDATE / DELETE -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h3 id="modalName" class="modal-name">Name</h3>
        <p id="modalEmail" class="modal-email">Email</p>

        <button id="editBtn" class="btn btn-edit">Edit (PUT)</button>
        <button id="deleteBtn" class="btn btn-delete">Delete (DELETE)</button>
    </div>
</div>

<!-- MODAL 2: FORM (CREATE AND UPDATE) -->
<div id="formModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h3 id="formTitle" class="form-title">Student</h3>

        <form id="studentForm">
            <input type="hidden" id="studentId">
            <input type="text" id="firstName" class="form-input" placeholder="First name" required>
            <input type="text" id="lastName" class="form-input" placeholder="Last name" required>
            <input type="email" id="email" class="form-input" placeholder="Email" required>
            <button type="submit" class="btn btn-save">Save Student</button>
        </form>
    </div>
</div>

<!-- 1st jQuery, 2nd our code (order matters) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="students/js/app.js"></script>
</body>
</html>
