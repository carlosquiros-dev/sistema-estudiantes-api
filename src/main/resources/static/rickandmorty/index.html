<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="nav-bar">
    <h2>Rick & Morty Universe</h2>
    <a href="/index.html" class="btn-back-page">⬅ Back to Students</a>
</div>

<!-- NESTED SELECT -->
<section class="panel">
    <h3>Browse by category</h3>
    <div class="selects">
        <select id="categorySelect">
            <option value="">1. Choose a category...</option>
            <option value="locations">Locations</option>
            <option value="episodes">Episodes</option>
        </select>

        <select id="itemSelect" disabled>
            <option value="">2. Choose a category first</option>
        </select>
    </div>
</section>

<!-- DEBOUNCED SEARCH -->
<section class="panel">
    <h3>Search character by name</h3>
    <input type="text" id="searchInput" class="search-input" placeholder="Type a name (e.g. rick)...">
</section>

<p id="status"></p>
<main id="results" class="grid-container"></main>

<!-- DETAIL MODAL -->
<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <button id="closeModal" class="btn-modal-back">⬅ Close</button>
        <div id="modalBody"></div>
    </div>
</div>

<!-- 1st jQuery, 2nd our code (order matters) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
